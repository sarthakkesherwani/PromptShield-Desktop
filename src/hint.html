<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popover.css"><title>PromptShield cell suggestion</title></head><body><article class="popover"><header><img class="shield" src="brand.png" alt=""><div><strong>PromptShield</strong><p id="hint-cell">Selected cell</p></div><button id="dismiss-hint" aria-label="Dismiss cell hint">×</button></header><div class="warning"><span></span><strong id="hint-category">Sensitive value</strong><span class="warning-label">MASK BEFORE SHARING</span></div><div class="replacement"><span id="hint-original"></span><span class="arrow" aria-hidden="true">→</span><strong id="hint-token"></strong></div><p id="hint-action">Replace this value before sharing.</p><textarea id="hint-preview" aria-label="Suggested replacement" readonly></textarea><footer><button id="hint-copy">Copy label</button><button id="hint-apply">Apply mask <span aria-hidden="true">↵</span></button></footer></article><script src="hint.js"></script></body></html>
